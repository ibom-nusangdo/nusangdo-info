    sum:'청소년상담복지센터부터 쉼터, 꿈드림, 디딤센터까지 대표 기관과 하는 일을 정리했어요.',
    kw:'취업 진로 근무처 기관 한국청소년상담복지개발원 청소년상담복지센터 1388 청소년동반자 찾아가는 상담 채용 청소년쉼터 일시 단기 중장기 청소년자립지원관 학교밖청소년지원센터 꿈드림 검정고시 국립청소년디딤센터 정서 행동 Wee센터 청소년수련관 문화관 사회복지관 가족센터 지자체',
    pages:['002-1','002-2'] },
  { no:'001', fname:'정보공유_법제도변화', date:'2026-10-14', cat:'법·제도', title:'2026년 꼭 알아야 할 청소년 법·제도 변화',
    sum:'부처 이름 변경, 쉼터 입소 시 보호자 통보 예외, 친족 성범죄 공소시효 폐지 등 다섯 가지.',
    kw:'법 법령 개정 제도 성평등가족부 여성가족부 청소년복지 지원법 시행령 쉼터 입소 보호자 통보 예외 가정 밖 청소년 청소년 보호법 예방적 회복적 보호지원 이주배경청소년지원센터 지방자치단체 청소년성보호법 아청법 친족 성범죄 공소시효 폐지 필기 면접 연수',
    pages:['001-1'] }
];
const CATS = ['전체','법·제도','시험·자격','현장·진로','상담 윤리','연수','심리검사'];

/* 카톡 등 앱 안 브라우저가 글씨를 키워 보여 줄 때, 원래 크기로 맞춰요 */
function fitText(){
  try{
    if(document.body.dataset.fit) return;
    const host=document.querySelector('main .wrap')||document.body;
    const p=document.createElement('p');
    p.setAttribute('aria-hidden','true');
    p.style.cssText='margin:0;padding:0;font-family:sans-serif;font-size:16px;line-height:1.6;letter-spacing:0;visibility:hidden;position:relative;';
    const probe=document.createElement('span'); probe.textContent='가나다라마바사아자차';
    p.appendChild(probe); p.appendChild(document.createTextNode(' 가나다라 마바사아 자차카타 파하 '.repeat(40)));
    host.appendChild(p);
    void p.offsetHeight;
    const got=probe.getBoundingClientRect().width;
    const fs=parseFloat(getComputedStyle(probe).fontSize)||16;
    p.remove();
    const c=document.createElement('canvas').getContext('2d'); c.font='16px sans-serif';
    const want=c.measureText('가나다라마바사아자차').width;
    let r=Math.max(want>0?got/want:1, fs/16);
    if(r>1.05 && r<2.5){ document.body.style.zoom=(1/r).toFixed(3); document.body.dataset.fit=r.toFixed(2); }
  }catch(e){}
}
window.addEventListener('load',()=>requestAnimationFrame(()=>requestAnimationFrame(fitText)));
const $ = id => document.getElementById(id);
const DAYS = ['일','월','화','수','목','금','토'];
const kst = new Date(Date.now() + 9*3600*1000);
const NOW = kst.toISOString().slice(0,16);
const openTime = d => d === '2026-10-19' ? '08:00' : '07:00';
const isLive = p => `${p.date}T${openTime(p.date)}` <= NOW;
const fmt = d => { const [y,m,dd] = d.split('-').map(Number); const w = DAYS[new Date(Date.UTC(y,m-1,dd)).getUTCDay()]; return `${y}.${m}.${dd} (${w})`; };
const LIVE = POSTS.filter(isLive);
const NEXT = POSTS.filter(p => !isLive(p)).sort((a,b)=>a.date.localeCompare(b.date))[0];
const qEl = $('q'), listEl = $('list'), statusEl = $('status'), emptyEl = $('empty');
let cat = '전체';

const norm = s => (s||'').toLowerCase().replace(/[\s·.,()\-–~'‘’"“”]/g,'');
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hi(text, words){
  let out = esc(text);
  words.forEach(w=>{ if(!w) return;
    const re = new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    out = out.replace(re,'<mark>$1</mark>'); });
  return out;
}

function renderChips(){
  $('chips').innerHTML = CATS.map(c=>`<button class="chip" type="button" aria-pressed="${c===cat}" data-cat="${c}">${c}</button>`).join('');
}
$('chips').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  cat = b.dataset.cat; renderChips(); render();
});

function render(){
  const raw = qEl.value.trim();
  const words = raw.split(/\s+/).filter(Boolean);
  const nwords = words.map(norm).filter(Boolean);
  const shown = LIVE.filter(p=>{
    if(cat!=='전체' && p.cat!==cat) return false;
    const hay = norm([p.no,'no'+p.no,p.title,p.sum,p.kw,p.cat].join(' '));
    return nwords.every(w=>hay.includes(w));
  });
  listEl.innerHTML = shown.map(p=>`
    <li><button class="card" type="button" data-no="${p.no}">
      <span class="thumb"><img src="img/${p.pages[0]}-thumb.jpg" alt="" loading="lazy" draggable="false"></span>
      <span class="card-body">
        <span class="meta"><span class="no">NO.${p.no}</span><span class="tag">${p.cat}</span><span>${fmt(p.date)}</span></span>
        <span class="card-title">${hi(p.title,words)}</span>
        <span class="card-sum">${hi(p.sum,words)}</span>
        <span class="count">포스터 ${p.pages.length}장 보기 →</span>
      </span>
    </button></li>`).join('');
  emptyEl.hidden = shown.length>0;
  statusEl.textContent = raw || cat!=='전체'
    ? `${shown.length}개를 찾았어요`
    : `지금까지 ${LIVE.length}개의 정보공유가 있어요`;
}
qEl.addEventListener('input', render);
listEl.addEventListener('click', e=>{
  const b = e.target.closest('.card'); if(b) openPost(b.dataset.no, 'push');
});

let lastFocus = null;
function openPost(no, mode){
  const i = LIVE.findIndex(p=>p.no===no); if(i<0) return;
  const p = LIVE[i];
  lastFocus = document.activeElement;
  $('vtitle').textContent = `NO.${p.no} · ${p.title}`;
  const prev = LIVE[i+1], next = LIVE[i-1];
  $('pages').innerHTML = p.pages.map((k,j)=>`
    <figure class="page" style="margin:0">
      <span class="guard"><img src="img/${k}.jpg" alt="정보공유 NO.${p.no} ${p.title} ${j+1}장" draggable="false"></span>
      <figcaption class="page-foot"><span>${j+1} / ${p.pages.length}장</span><span>누구나 상담사 도전기 · 이봄</span></figcaption>
    </figure>`).join('') + `
    <div class="vnav">
      ${prev?`<button class="btn" type="button" data-go="${prev.no}">← NO.${prev.no}</button>`:'<span></span>'}
      ${next?`<button class="btn" type="button" data-go="${next.no}">NO.${next.no} →</button>`:'<span></span>'}
    </div>`;
  const v = $('viewer'); v.hidden = false; v.scrollTop = 0;
  document.body.style.overflow='hidden';
  try{
    if(mode==='push') history.pushState({v:p.no},'','#no'+p.no);
    else if(mode==='replace') history.replaceState({v:p.no},'','#no'+p.no);
  }catch(e){}
  $('vclose').focus();
}
function hideViewer(){
  $('viewer').hidden = true; document.body.style.overflow='';
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
function closePost(){
  if(history.state && history.state.v){ history.back(); }
  else { hideViewer(); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
}
$('vclose').addEventListener('click', closePost);
/* 휴대폰 뒤로가기: 포스터 보기 → 목록으로 */
window.addEventListener('popstate', ()=>{
  const h=(location.hash||'').match(/^#no(\d{3})$/);
  if(h && LIVE.some(p=>p.no===h[1])) openPost(h[1], null); else hideViewer();
});
$('pages').addEventListener('click', e=>{ const b=e.target.closest('[data-go]'); if(b) openPost(b.dataset.go,'replace'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('viewer').hidden) closePost(); });

['contextmenu','dragstart'].forEach(t=>document.addEventListener(t,e=>{ if(e.target.closest('.page,.thumb,.guard,img')) e.preventDefault(); }));
renderChips(); render();
if(NEXT){ const n=$('next'); n.hidden=false; const josa='2459'.includes(NEXT.no.slice(-1))?'는':'은'; n.innerHTML=`<b>NO.${NEXT.no}</b>${josa} ${fmt(NEXT.date)} 오전 ${openTime(NEXT.date)==='08:00'?8:7}시에 올라와요.<br><span style="white-space:nowrap">월·수·금 오전 7시마다</span> 새 정보공유가 더해져요.`; }
const m = (location.hash||'').match(/^#no(\d{3})$/);
if(m && LIVE.some(p=>p.no===m[1])){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} openPost(m[1], 'push'); }
</script>
